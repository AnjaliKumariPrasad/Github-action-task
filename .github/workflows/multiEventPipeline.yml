name: "Multi event pipeline /workfollow"

on:
  push:
    branches:
      - main
      - test
  schedule:
    - cron: '0 10 * * 2,4' # every Tuesday and Thursday at 10:00 UTC

  pull_request:
    branches:
      - main
      - test

    types:
      - closed

  workflow_dispatch:
    
jobs:
  on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: "Running on master/test push"
        run: echo "Running on master/test push" 

  on-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Running on master/test pull request"
        run: echo "Running on master/test pull request"      
  on-pull-request-closed:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: "Running on master/test pull request closed"
        run: echo "Running on master/test pull request closed"

  on-workflow-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: "Running on workflow dispatch"
        run: echo "Running on workflow dispatch"
  on-schedule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: "Running on schedule"
        run: echo "Running on schedule"       